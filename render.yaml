# === FORGE Trading Agent — Render Blueprint ===
# Web service: API + Dashboard (free tier)
# Pipeline quotidien: Cron AutoClaw (job 6d79ba5c) -> Supabase -> Dashboard Render
# Doc: https://render.com/docs/blueprint-spec

services:
  # === API + Dashboard (Web Service) ===
  - type: web
    name: forge-dashboard
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python api/server.py
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
