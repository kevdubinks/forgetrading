# .github/workflows/daily-pipeline.yml
# FORGE Trading Agent — Pipeline quotidien via GitHub Actions
# Declenche: 14h30 Paris (12h30 UTC) + manuel possible
# Gratuit pour repos publics (2000 min/mois)

name: FORGE Daily Pipeline

on:
  schedule:
    - cron: "30 12 * * *"  # 14h30 Paris (12h30 UTC ete)
  workflow_dispatch:        # Manuel depuis l'onglet Actions

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/run_daily.py
